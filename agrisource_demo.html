/* Small visual polish only. Original responsive grids, cards and navigation are unchanged. */
:root{--shadow:0 4px 17px rgba(19,53,34,.045);--radius:14px}
.hero:before,.hero:after{opacity:.42}
.hero-art img{transform:rotate(2deg)}
.hero-art img:nth-child(1){transform:rotate(-3deg)}
.hero-art img:nth-child(3){transform:rotate(4deg)}
.nav-icon svg{height:18px;width:18px;display:block;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.category-icon svg{height:23px;width:23px;display:block;stroke:var(--forest);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.auth-wrap{min-height:calc(100vh - 74px);display:grid;place-items:center;padding:34px 20px}
.auth-panel{display:grid;grid-template-columns:minmax(0,1.07fr) minmax(350px,.93fr);max-width:1060px;width:100%;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 42px #183d3017}
.auth-intro{background:linear-gradient(135deg,var(--forest2),#225d43);color:#fff;padding:50px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.auth-intro h1{color:#fff;font-size:34px;margin:12px 0 13px}
.auth-intro p{font-size:14px;color:#d5e6da;max-width:400px}
.auth-intro .small{color:#c8decf}
.auth-main{padding:34px 36px 38px;display:grid;gap:16px;align-content:center}
.auth-main h2{font-size:23px}
.auth-main form{display:grid;gap:13px}
.auth-roles{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:5px}
.auth-role{border-radius:8px;padding:8px 10px;color:var(--forest);background:#fff;border:1px solid var(--line);font-weight:700;font-size:12px}
.auth-role.active{background:var(--sage);border-color:#9ac5a7}
.auth-help{font-size:12px;color:var(--muted);background:#f6f9f5;border:1px solid #e0ebe0;border-radius:10px;padding:11px 13px}
.auth-error{color:var(--red);font-size:12px;font-weight:650;min-height:18px}
.account-chip{font-size:11px;font-weight:750;color:var(--forest2);max-width:275px;text-align:right;line-height:1.2}
.account-chip small{font-weight:500;color:var(--muted);display:block;margin-top:3px}
@media(max-width:830px){.auth-panel{grid-template-columns:1fr}.auth-intro{padding:26px 26px 22px;gap:12px}.auth-intro h1{font-size:26px}.auth-main{padding:25px}}
@media(max-width:680px){.auth-wrap{padding:13px}.auth-main{padding:18px}.account-chip{max-width:150px;font-size:10px}.top-actions{gap:6px}}

/* Targeted navigation fix: desktop sidebar stays visible while only the workspace content scrolls. */
@media (min-width:981px) {
 html,body { height:100%; overflow:hidden; }
 .app-shell { height:calc(100dvh - 74px); min-height:0; }
 .sidebar { height:100%; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:thin; }
 .main { height:100%; min-height:0; overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; }
 .auth-wrap { height:calc(100dvh - 74px); min-height:0; overflow-y:auto; }
}
/* On phones and tablets, preserve the familiar horizontally scrolling navigation strip. */
@media (max-width:980px) {
 html,body { height:auto; overflow:auto; }
 .app-shell { height:auto; }
 .main { height:auto; overflow:visible; }
 .sidebar { height:auto; overflow-x:auto; overflow-y:hidden; }
}
.dropoff-fields { display:grid; gap:12px; padding:15px 16px; border:1px solid var(--line); border-radius:12px; background:#fbfdfb; margin-bottom:14px; }
.dropoff-fields .field input { background:var(--white); }
.dropoff-fields .btn { justify-self:start; }
.dropoff-caption { font-size:12px; color:var(--muted); margin:0; }

function estimatedFee(branches,town,service='shared'){
 if(service==='collection')return 0;
 const ds=branches.map(b=>townDistance(BBY[b].town,town));const longest=Math.max(0,...ds);
 let base=65+longest*1.05+(Math.max(1,branches.length)-1)*45;
 if(service==='scheduled'||service==='shared')base*=.68;
 if(service==='dedicated')base*=1.55;
 return Math.round(base/5)*5
}

function fuzzyDistance(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;const d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){const cost=a[i-1]===b[j-1]?0:1;d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+cost);if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}
function sim(a,b){if(a===b)return true;if(a.includes(b)||b.includes(a))return true;if(Math.min(a.length,b.length)<4)return false;return fuzzyDistance(a,b)<= (Math.max(a.length,b.length)>9?2:1)}
function parsedSearch(q){let text=q.trim(),city='';for(const t of Object.keys(TOWNS).sort((a,b)=>b.length-a.length)){if(new RegExp('\\b'+t+'\\b','i').test(text)){city=t;text=text.replace(new RegExp('\\b'+t+'\\b','ig'),'')}}let found=text.match(/\b(\d+)\s*(?:bags?|rolls?|units?|bottles?|packs?|blocks?|sets?|tubs?)\b/i),qty=0;if(found){qty=+found[1];text=text.replace(found[0],'')}return{text:text.trim(),city,qty}}
function searchRank(p,q){const words=tokens(q);if(!words.length)return 1;const source=tokens(p.name+' '+p.aliases+' '+p.brand+' '+p.spec+' '+cat(p.cat).name+' '+p.id);const lower=(p.name+' '+p.aliases+' '+cat(p.cat).name).toLowerCase();let score=0,miss=0;for(const w of words){const options=[w,...(SYN[w]||[])];let weight=0;for(const option of options){if(source.includes(option)){weight=Math.max(weight,source.indexOf(option)<7?8:5)}else if(source.some(t=>sim(t,option))){weight=Math.max(weight,3)}}if(!weight)miss++;else score+=weight}if(miss>=2||miss>words.length*.6)return 0;if(lower.includes(q.toLowerCase()))score+=30;score-=miss*9;if(p.name.toLowerCase().startsWith(q.toLowerCase()))score+=12;return Math.max(0,score)}
function productResults(query=ui.q){let ps=PRODUCTS.slice();if(ui.category!=='all')ps=ps.filter(p=>p.cat===ui.category);if(ui.searchBrand!=='all')ps=ps.filter(p=>p.brand===ui.searchBrand);if(ui.searchRetailer!=='all')ps=ps.filter(p=>onlyProdOffer(p.id).some(o=>BBY[o.branch].retailer===ui.searchRetailer));if(query.trim())ps=ps.map(p=>({...p,_score:searchRank(p,query)})).filter(p=>p._score>0);else ps=ps.map(p=>({...p,_score:1}));if(ui.fullOnly)ps=ps.filter(p=>productOffers(p.id).some(o=>hasComplete(o)));if(ui.sort==='price')ps.sort((a,b)=>minPrice(a.id)-minPrice(b.id));else if(ui.sort==='near')ps.sort((a,b)=>bestDistance(a.id)-bestDistance(b.id));else if(ui.sort==='offers')ps.sort((a,b)=>onlyProdOffer(b.id).length-onlyProdOffer(a.id).length);else ps.sort((a,b)=>b._score-a._score||onlyProdOffer(b.id).length-onlyProdOffer(a.id).length);return ps}

<p class="muted small">Compare branch-specific offers below. Reported inventory is not a reserved order: participating branches verify the exact quantity before final checkout.</p><div class="form-row two mt16">${field('Quantity required','detailQty',ui.quantity,'number','min="1" max="1000"')}<div class="field"><label>Location</label>${chooseTown('detailTown')}</div></div><div class="flex-wrap mt16">${small(state.saved.includes(id)?'♥ Saved product':'♡ Save for later','save-product',`data-id="${id}"`)}${small('Create bulk RFQ','new-rfq',`data-product="${id}"`,'secondary')}</div>${p.restricted?`<p class="notice warn mt16">This demo item is marked as requiring additional product-category eligibility checks. Checkout is disabled until appropriate controls are defined.</p>`:''}</div></div></div>${section(`Compare ${offers.length} retailer-branch offers`,'Order quantity, location, availability confidence and estimated delivered cost are considered separately.')}<div class="card">${offers.length?offers.map(row).join(''):empty('📦','No branch offers','Try another product in this category.')}</div></div><aside><div class="card"><h3>How buying works</h3><div class="activity"><div class="activity-item"><span class="activity-dot"></span><div><strong>Choose the right offer</strong><div class="muted small">Compare suppliers, quantities and total costs.</div></div></div><div class="activity-item"><span class="activity-dot"></span><div><strong>Verify and secure stock</strong><div class="muted small">The supplying branch confirms your requirements.</div></div></div><div class="activity-item"><span class="activity-dot"></span><div><strong>One AgriSource checkout</strong><div class="muted small">Pay once across all participating retailers.</div></div></div><div class="activity-item"><span class="activity-dot"></span><div><strong>Collect or receive delivery</strong><div class="muted small">AgriSource coordinates the purchasing outcome.</div></div></div></div></div></aside></div>`}
function retailerStore(id){const r=RBY[id],bs=BRANCHES.filter(b=>b.retailer===id),offers=retailerOffers(id).filter(o=>o.enabled),unique=[...new Set(offers.map(o=>o.product))].map(p=>PBY[p]);return`<button class="btn ghost sm mb16" data-a="back-products">← Back to marketplace</button><div class="profile-banner"><div class="eyebrow" style="color:#cbe4d1">Participating demo retailer</div><h1>${safe(r.name)}</h1><p>${safe(r.desc)}. Explore relevant branch-based offers and purchase through the AgriSource checkout.</p><div class="flex-wrap">${badge(`${bs.length} branches`,'white')}${badge(`${unique.length} products`,'white')}${badge('Marketplace partner','white')}</div></div>${section('Branch network','Availability and prices may differ by branch.')}<div class="quickchips">${bs.map(b=>`<span class="quickchip">📍 ${safe(b.town)} · ${safe(b.area)}</span>`).join('')}</div>${section('Products from this retailer','These items also appear in the consolidated AgriSource catalogue.')}<div class="products">${unique.map(renderProductCard).join('')}</div>`}
function cartLines(){return state.cart.map((it,i)=>{const o=byOffer(it.offer),p=o?PBY[o.product]:null;if(!p)return'';return`<div class="lineitem"><img src="${ph(p)}" alt="Product photo"><div><strong>${safe(p.name)}</strong><div class="small muted">${safe(offerLabel(o))}</div><div class="small muted">${money(o.price)} per ${safe(p.unit)} · ${offerAvailable(o)} currently available</div></div><div class="field"><label>Quantity</label><input type="number" min="1" max="1000" value="${it.qty}" data-change="cartqty" data-index="${i}" aria-label="Quantity for ${safe(p.name)}"></div><div class="end"><strong>${money(o.price*it.qty)}</strong><div>${small('Remove','remove-cart',`data-index="${i}"`,'ghost')}</div></div></div>`}).join('')}
function deliveryLocationRecord(kind){
 ui.deliveryAddresses ??={personal:{},farm:{}};
 ui.deliveryAddresses[kind]??={};
 return ui.deliveryAddresses[kind];
}
function deliveryAddressForm(){
 if(ui.deliveryOption==='collection')return '';
 const farm=ui.deliveryOption==='farm',kind=farm?'farm':'personal',loc=deliveryLocationRecord(kind);
 const entry=(label,key,placeholder,required=false)=>`<div class="field"><label for="drop-${kind}-${key}">${label}</label><input id="drop-${kind}-${key}" data-address-type="${kind}" data-delivery-field="${key}" value="${safe(loc[key]||'')}" placeholder="${safe(placeholder)}" ${required?'required':''}></div>`;
 return `<div class="dropoff-fields"><div><strong>${farm?'Farm delivery location':'Where should we deliver?'}</strong><p class="dropoff-caption">${farm?'Give the farm location, not just the nearest town.':'Provide a practical drop-off point so the transporter knows where to go.'} The town above is used for the indicative delivery estimate.</p></div>
 ${farm?entry('Farm name (optional)','name','e.g. Molefhi Farms'):''}
 <div class="form-row two">${entry(farm?'Farm area / village / ward':'Area / ward / neighbourhood','area',farm?'e.g. Moshupa road, farm entrance':'e.g. Phase 4, Block 8')}${entry('Landmark / access instructions (optional)','landmark',farm?'e.g. Turn right at the cattle crush':'e.g. Gate opposite the clinic')}</div>
 <div class="form-row two">${entry('Map pin or GPS coordinates (optional)','pin','e.g. -24.65, 25.91 or maps link')}<div class="field"><label>Location assistance</label><button class="btn secondary sm" type="button" data-a="use-gps" data-kind="${kind}">Use my current location</button><div class="help">With browser permission. Confirm the town and destination details yourself.</div></div></div>
 <div class="tiny muted">Enter an area or a map pin before submitting. Final delivery suitability and charges will be verified by AgriSource.</div></div>`;
}
function deliveryDropoff(){
 if(ui.deliveryOption==='collection')return null;
 const kind=ui.deliveryOption==='farm'?'farm':'personal',loc=deliveryLocationRecord(kind);
 return {type:kind,town:ui.deliveryTown,name:kind==='farm'?(loc.name||'').trim():'',area:(loc.area||'').trim(),landmark:(loc.landmark||'').trim(),pin:(loc.pin||'').trim()};
}
function deliveryDescription(o,detail=false){
 if(o.delivery==='collection')return 'Collection from participating branches';
 const a=o.dropoff;
 if(!a)return 'Delivery to '+o.town;
 const parts=[a.type==='farm'?'Deliver to farm':'Deliver to me'];
 if(a.name)parts.push(a.name);
 if(a.area)parts.push(a.area);
 parts.push(a.town||o.town);
 if(detail&&a.landmark)parts.push('Landmark: '+a.landmark);
 if(detail&&a.pin)parts.push('Pin: '+a.pin);
 return parts.join(' · ');
}
function basketPage(){if(!state.cart.length)return head('Your basket','Build a basket across multiple participating stores.')+`<div class="card">${empty('🛒','Your basket is empty','Start by exploring the consolidated product catalogue.',small('Find products','nav',`data-page="discover"`))}</div>`;const branches=[...new Set(state.cart.map(x=>byOffer(x.offer)?.branch).filter(Boolean))];const base=sum(state.cart.map(i=>byOffer(i.offer).price*i.qty));const fee=ui.deliveryOption==='collection'?0:estimatedFee(branches,ui.deliveryTown,ui.cartService);const hasShort=state.cart.some(x=>offerAvailable(byOffer(x.offer))<x.qty);const services=[['shared','Scheduled / shared delivery','Lower-cost route where compatible; indicative next available service'],['express','Standard coordinated delivery','Flexible delivery coordination through contracted transport'],['dedicated','Dedicated vehicle','Private movement of goods, subject to cargo and capacity']];return`${head('Smart basket','Products from multiple retailers, one coordinated purchase.',small('Continue shopping','nav',`data-page="discover"`))}<div class="main-two"><section><div class="card"><div class="flex space mb16"><h3>Products in your basket</h3>${badge(`${state.cart.length} product lines`,'neutral')}</div>${cartLines()}${hasShort?`<div class="notice warn mt16">One or more requested quantities exceed the latest reported stock. AgriSource will require branch verification and may present another supplier or adjusted quantity.</div>`:''}</div>${section('Procurement optimiser','Compare more than just unit prices. Apply an alternative sourcing plan.') }<div class="grid g3">${[['cost','Lowest total cost','Use eligible lower-priced offers'],['stops','Fewest branches','Reduce collection complexity'],['near','Closest supply','Prioritise nearby participating branches']].map(([id,label,sub])=>`<div class="card card-tight"><strong>${label}</strong><div class="muted small mb16">${sub}</div>${small('Apply plan','optimize',`data-plan="${id}"`,'secondary')}</div>`).join('')}</div>${section('How would you like the goods?','View estimated charges before submitting an order for verification.')}<div class="card"><div class="form-row two mb16">${selectField('Fulfilment','cartOption',[['delivery','Deliver to me'],['farm','Deliver to farm'],['collection','I will collect']],ui.deliveryOption)}${selectField(ui.deliveryOption==='farm'?'Farm town / nearest village':ui.deliveryOption==='collection'?'Collection area':'Delivery town / village','cartDestination',townsOptions,ui.deliveryTown)}</div>${deliveryAddressForm()}${ui.deliveryOption!=='collection'?services.map(([id,title,desc])=>`<label class="select-card ${ui.cartService===id?'active':''}"><input type="radio" name="cartService" value="${id}" ${ui.cartService===id?'checked':''}><div class="grow"><strong>${title}</strong><small>${desc}</small></div><strong>${money(estimatedFee(branches,ui.deliveryTown,id))}</strong></label>`).join(''):`<div class="notice">Collection is currently selected. You will receive a ready-for-collection notice for each applicable participating branch (${branches.length} collection points).</div>`}<div class="foot-note">All delivery amounts are hypothetical demo estimates, not approved service quotations. Final scheduling depends on location, load and provider capacity.</div></div></section><aside><div class="card"><h3>Order summary</h3>${branches.map(b=>`<div class="info-row"><span class="grow">🏬 ${safe(RBY[BBY[b].retailer].short)}<div class="tiny muted">${safe(namedBranch(b))}</div></span>${badge(state.cart.filter(i=>byOffer(i.offer).branch===b).length+' lines','neutral')}</div>`).join('')}<div class="line"></div><div class="summary-row"><span>Products</span><strong>${money(base)}</strong></div><div class="summary-row"><span>Estimated delivery</span><strong>${money(fee)}</strong></div><div class="summary-row total"><span>Estimated total</span><span>${money(base+fee)}</span></div><p class="muted small mt16">No payment is taken yet function orderTimeline(o){let s=orderStage(o),i=s==='completed'?4:['awaiting-dispatch','ready-collection','in-transit'].includes(s)?3:s==='preparing'?2:['ready-payment'].includes(s)?1:0;return`<div class="steps">${['Verify','Checkout','Preparing','Fulfilment','Complete'].map((x,n)=>`<span class="step ${n<=i?'on':''} ${n===i?'current':''}"><i></i>${x}</span>`).join('')}</div>`}

delivery to farm':'AgriSource coordinated delivery'} · ${money(o.fee||0)} service fee</span><div class="strong">Order total: ${money(totalOrder(o))}</div></div><div class="flex-wrap">${actions.join('')}</div></div>${o.delivery==='delivery'&&o.job?`<div class="notice">Delivery status: <strong>${safe(o.job.status)}</strong>${o.job.status==='delivered'?' · delivery confirmed':''}. Your secure handover code is <strong>${safe(o.code)}</strong> (demo).</div>`:''}</div>`}

function branchHandover(){const b=ui.branch,rows=state.orders.flatMap(o=>o.suborders.filter(s=>s.branch===b&&['ready','handed'].includes(s.status)).map(s=>({order:o,sub:s})));return`${contextHeader('branch')}${head('Collection, handover & branch activity','Release confirmed goods only when the corresponding order is ready for collection or transport.')}<div class="grid g2"><div class="card"><h3>Ready for handover</h3>${rows.length?rows.map(({order:o,sub:s})=>`<div class="info-row"><div class="grow"><strong>${o.id}</strong> ${badge(branchStatus(s.status),branchTone(s.status))}<div class="muted small">${s.items.map(i=>PBY[byOffer(i.offer).product].name+' × '+i.qty).join(', ')}</div><div class="muted tiny">${o.delivery==='collection'?'Customer pickup':'Transport provider collection'}</div></div>${s.status==='ready'?small('Confirm handover','handover',`data-id="${o.id}"`):''}</div>`).join(''):empty('📦','Nothing to hand over','Paid orders ready for pickup will appear here.')}</div><div class="card"><h3>Recent inventory & order activity</h3>${state.audit.filter(a=>a.who.includes(BBY[b].town)||a.message.includes(b)).slice(0,10).map(a=>`<div class="info-row"><div><strong>${safe(a.message)}</strong><div class="tiny muted">${safe(a.who)} · ${fmtDate(a.at)}</div></div></div>`).join('')||'<p class="muted small">Activity for this branch will appear after updates.</p>'}</div></div>`}
function opsOverview(){const paid=state.orders.filter(o=>o.paid&&!o.refund),gmv=sum(paid.map(o=>sum(o.suborders.map(totalSub)))),fees=sum(paid.map(o=>o.fee||0)),open=state.orders.filter(o=>['exception','approval','verifying'].includes(orderStage(o))).length;const statusdata=[['Awaiting verification',state.orders.filter(o=>orderStage(o)==='verifying').length],['Need customer approval',state.orders.filter(o=>orderStage(o)==='approval').length],['Ready for dispatch',state.orders.filter(o=>orderStage(o)==='awaiting-dispatch').length],['Active delivery jobs',state.orders.filter(o=>o.job&&!['delivered','completed'].includes(o.job.status)).length]];return`${head('Operations command centre','A coordinated overview of marketplace transactions, retailer activity, customer resolutions and fulfilment.',badge('Simulation environment','amber'),'Agroproducts and Technologies')}<div class="grid g4">${kpi('Gross merchandise value',money(gmv),'Paid retailer product sales','₱')}${kpi('Marketplace commission',money(gmv*state.commission),'Illustrative rate, not final terms','↗')}${kpi('Delivery fee income',money(fees),'Before transporter-related costs','🚚')}${kpi('Orders needing attention',open,'Verification or approval exceptions','⚠')}</div><div class="main-two mt16"><div class="card"><div class="panel-title"><h3>Transaction & fulfilment queue</h3>${small('Open order assurance','nav',`data-page="orders"`)}</div>${statusdata.map(([name,n])=>`<div class="info-row"><div class="grow"><strong>${name}</strong></div>${badge(String(n),n?'amber':'neutral')}</div>`).join('')}<div class="notice mt16">The command centre presents orders from all participating retailers; retailer users can only access their authorised businesses in the planned production system.</div></div><div class="card"><h3>Marketplace coverage</h3>${figureBars(RETAILERS.map(r=>[r.short,retailerOffers(r.id).length]),n=>String(n)+' listings')}</div></div>${section('Recent activity','Orders, price changes, availability updates and resolutions.')}<div class="card">${state.audit.slice(0,10).map(a=>`<div class="info-row"><div class="grow"><strong>${safe(a.message)}</strong><div class="muted tiny">${safe(a.who)} · ${fmtDate(a.at)}</div></div></div>`).join('')}</div>`}
function opsOrders(){const orders=state.orders.slice().sort((a,b)=>b.created-a.created),filter=ui.subfilter;const shown=filter==='all'?orders:orders.filter(o=>orderStage(o)===filter);return`${head('Order assurance','Monitor branch responses, customer approval, payment readiness and exception recovery.')}<div class="filter-bar"><div class="quickchips">${[['all','All orders'],['verifying','Verifying'],['approval','Approvals'],['exception','Exceptions'],['ready-payment','Ready for payment'],['awaiting-dispatch','Dispatch']].map(([v,label])=>`<button class="quickchip ${filter===v?'active':''}" data-a="subfilter" data-id="${v}">${label}</button>`).join('')}</div></div><div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>Order / customer</th><th>Retailers & branches</th><th>Stage</th><th>Total amount</th><th>Action</th></tr></thead><tbody>${shown.map(o=>`<tr><td><strong>${o.id}</strong><div class="tiny muted">${safe(o.customer)} · ${fmtDate(o.created)}</div></td><td>${o.suborders.map(s=>`<div class="tiny">${safe(RBY[BBY[s.branch].retailer].short)} · ${safe(BBY[s.branch].town)} — ${safe(branchStatus(s.status))}</div>`).join('')}</td><td>${badge(orderText(orderStage(o)),stageTone(orderStage(o)))}</td><td><strong>${money(totalOrder(o))}</strong></td><td>${small('Review / resolve','order-modal',`data-id="${o.id}"`,'primary')}</td></tr>`).join('')||'<tr><td colspan="5">No orders in this status.</td></tr>'}</tbody></table></div></div>`}
/* Dispatch planning (stakeholder simulation): capacity/coverage/time/cargo must pass first.
   A match creates an OFFER, not an accepted job. Drivers accept/decline; pickup waits for branch readiness.
   Matching is deterministic and transparent. Road distances, real schedules and commercial tariffs need APIs in production. */
const dispatchOn=()=>state.dispatch?.auto!==false;
const unitKg=name=>{const m=/(\d+(?:\.\d+)?)\s*(kg|ml|l|g)\b/i.exec(name||'');if(!m)return 15;const v=Number(m[1]),u=m[2].toLowerCase();return u==='ml'||u==='g'?v/1000:v};
const loadKg=o=>Math.max(1,Math.round(sum(o.suborders.flatMap(sb=>sb.items.map(i=>unitKg(PBY[byOffer(i.offer)?.product]?.name)*i.qty)))));
const driverName=d=>d?d.name+' · '+d.company:'Unassigned';
const nextServiceDate=()=>{const x=new Date();x.setDate(x.getDate()+1);return x.toISOString().slice(0,10)};
const dispatchDate=x=>x.date||x.job?.slot||x.deliveryDate||nextServiceDate();
const isSharedService=x=>['shared','scheduled'].includes(x.service);
const dispatchTask=(record,type)=>type==='order'?{
 key:'order:'+record.id,source:record,type:'order',from:[...new Set(record.suborders.map(sb=>BBY[sb.branch].town))],to:record.town,kg:loadKg(record),service:record.service,date:dispatchDate(record),cargo:record.suborders.flatMap(sb=>sb.items.map(it=>PBY[byOffer(it.offer)?.product]?.name||'')).join(' + '),special:record.suborders.some(sb=>sb.items.some(it=>PBY[byOffer(it.offer)?.product]?.restricted))
}:{key:'transport:'+record.id,source:record,type:'transport',from:[record.from],to:record.to,kg:Number(record.weight)||0,service:record.service,date:dispatchDate(record),cargo:record.cargo||'',special:/livestock|cattle|goat|chemical|vaccine|cold.chain|hazardous/i.test(record.cargo||'')};
const activeDispatchTasks=()=>[
 ...state.orders.filter(o=>o.job&&['offered','assigned','picked','in-transit'].includes(o.job.status)&&!o.refund).map(o=>({...dispatchTask(o,'order'),driver:o.job.driver,route:o.job.route,status:o.job.status})),
 ...state.transport.filter(t=>['offered','assigned','picked'].includes(t.status)).map(t=>({...dispatchTask(t,'transport'),driver:t.driver,route:t.route,status:t.status}))
];
const compatibleRoute=(a,b)=>isSharedService(a)&&isSharedService(b)&&a.date===b.date&&townDistance(a.to,b.to)<=65&&a.from.every(t=>b.from.some(p=>townDistance(t,p)<=155))&&b.from.every(t=>a.from.some(p=>townDistance(t,p)<=155))&&!a.special&&!b.special;
function dispatchCandidates(task){
 const active=activeDispatchTasks().filter(x=>x.key!==task.key);
 const candidates=[];
 for(const d of state.fleet){
  if(!d.available||!task.kg||task.kg>d.capacityKg||(task.special&&!d.special))continue;

let formBusy=false;
const runForm=f=>{if(!f||!f.id||formBusy)return;if(f.reportValidity&&!f.reportValidity())return;formBusy=true;setTimeout(()=>{formBusy=false},0);onFormSubmit({target:f,preventDefault(){}})};
document.addEventListener('click',e=>{const btn=e.target.closest&&e.target.closest('button[type=submit],input[type=submit]'),f=btn&&btn.form;if(!f||!f.id)return;e.preventDefault();runForm(f)},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(!t||!t.form||!t.form.id||t.tagName==='TEXTAREA'||t.tagName==='BUTTON')return;e.preventDefault();runForm(t.form)},true);

document.addEventListener('change',async e=>{if(e.target.id!=='inventoryUpload')return;if(!(isRetailer()||isBranch())||!authorizedBranch(ui.branch))return;const file=e.target.files?.[0];if(!file)return;try{const text=await file.text(),rows=text.trim().split(/\r?\n/),head=rows.shift().toLowerCase().split(',').map(x=>x.trim());const pi=head.indexOf('product_id'),qi=head.indexOf('quantity'),pr=head.indexOf('price');if(pi<0||qi<0||pr<0)return toast('CSV must contain product_id, quantity and price columns.',true);let count=0,skipped=0;for(const line of rows){if(!line.trim())continue;const cs=line.split(',').map(x=>x.trim()),product=cs[pi],q=Number(cs[qi]),price=Number(cs[pr]);if(!PBY[product]||!Number.isInteger(q)||q<0||!Number.isFinite(price)||price<=0){skipped++;continue}let offer=chooseOffer(product,ui.branch,state.offers);if(offer){if(q<heldQty(offer.id)){skipped++;continue}offer.qty=q;offer.price=price;offer.updated=Date.now();offer.confidence='Branch reported'}else{if(!RBY[BBY[ui.branch].retailer].cats.includes(PBY[product].cat)){skipped++;continue}offer={id:'O'+String(state.offers.length+1).padStart(4,'0'),product,branch:ui.branch,qty:q,price,updated:Date.now(),confidence:'Branch reported',enabled:true};state.offers.push(offer)}count++}audit(namedBranch(ui.branch),`CSV stock upload: ${count} rows updated`);save();render();toast(`Imported ${count} inventory rows; ${skipped} skipped.`)}catch(err){console.error(err);toast('Unable to read CSV file.',true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal){ui.modal=null;render()}});
try{if(dispatchOn())dispatchWaiting()}catch(e){console.warn(e)}
try{const current=sessionStorage.getItem(LOGIN_SESSION_KEY);const account=DEMO_ACCOUNTS.find(a=>a.id===current);if(account)signedIn(account,false);else startGuest()}catch(e){startGuest()}
</script></body></html>
